<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Snake — Hikari</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 8px; touch-action: manipulation; }
  a.back { color: #94a3b8; text-decoration: none; align-self: flex-start; margin-bottom: 4px; font-size: .85rem; }
  h1 { font-size: 1.1rem; margin-bottom: 4px; }
  .stats { display: flex; gap: 12px; margin-bottom: 6px; font-size: .85rem; }
  .stats b { color: #fbbf24; }
  canvas { background: #020617; border: 2px solid #334155; border-radius: 8px; max-width: 92vw; }
  .pad { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px; margin-top: 8px; }
  .pad button { height: 46px; font-size: 1.2rem; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; }
  .pad button:active { background: #334155; }
  .wide { grid-column: span 3; font-size: .9rem !important; height: 38px !important; }
  #msg { margin-top: 4px; min-height: 1.2em; font-weight: 700; color: #f472b6; font-size: .9rem; }
  #reward { margin-top: 2px; min-height: 1.2em; font-weight: 700; color: #4ade80; font-size: .9rem; text-align: center; }
</style>
</head>
<body>
  <a class="back" href="../">← Semua game</a>
  <h1>🐍 Snake</h1>
  <div class="stats"><span>Skor <b id="score">0</b></span><span>Terbaik <b id="best">0</b></span></div>
  <canvas id="game" width="300" height="300"></canvas>
  <div id="msg"></div>
  <div id="reward"></div>
  <div class="pad">
    <span></span><button data-k="up">▲</button><span></span>
    <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
    <button class="wide" data-k="start">▶ Mulai / Ulangi</button>
  </div>
<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const N = 18, CELL = cv.width / N;
const PLAY_TOKEN = '__PLAY_TOKEN__';
const SERVER_HOST = '__SERVER_HOST__';
let submitted = false;
function submitScore(score) {
  const el = document.getElementById('reward');
  const manual = () => { el.textContent = PLAY_TOKEN.includes('__') ? ('Skor: ' + score) : ('Skor: ' + score + ' • Klaim: .klaim ' + PLAY_TOKEN); };
  if (!PLAY_TOKEN || PLAY_TOKEN.includes('__') || !SERVER_HOST || SERVER_HOST.includes('__')) return manual();
  try {
    const ws = new WebSocket('wss://' + SERVER_HOST + '/api/score');
    const to = setTimeout(() => { try { ws.close(); } catch (e) {} manual(); }, 8000);
    ws.onopen = () => ws.send(JSON.stringify({ token: PLAY_TOKEN, score }));
    ws.onmessage = (ev) => {
      clearTimeout(to);
      try {
        const r = JSON.parse(ev.data);
        el.textContent = r.ok ? ('+Rp' + r.amount + ' masuk! 💰') : ('Gagal, klaim manual: .klaim ' + PLAY_TOKEN);
      } catch (e) { manual(); }
      try { ws.close(); } catch (e) {}
    };
    ws.onerror = () => { clearTimeout(to); manual(); };
  } catch (e) { manual(); }
}
let snake, dir, next, food, score, best = 0, over, started, timer;
function saveBest() {}
document.getElementById('best').textContent = best;
function reset() {
  snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
  dir = next = { x: 1, y: 0 };
  score = 0; over = false; started = true; submitted = false;
  document.getElementById('msg').textContent = '';
  document.getElementById('reward').textContent = '';
  place();
  update(); loop();
}
function place() {
  do {
    food = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
  } while (snake.some((s) => s.x === food.x && s.y === food.y));
}
function step() {
  if (!started || over) return;
  dir = next;
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some((s) => s.x === h.x && s.y === h.y)) {
    over = true; started = false;
    if (score > best) { best = score; saveBest(); }
    document.getElementById('msg').textContent = '💀 Game Over!';
    if (!submitted) { submitted = true; submitScore(score); }
    update(); return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { score += 10; place(); }
  else snake.pop();
  update();
}
function loop() {
  clearTimeout(timer);
  if (!started || over) return;
  timer = setTimeout(() => { step(); loop(); }, Math.max(70, 160 - score / 4));
}
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#f87171';
  ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, 7); ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i ? '#4ade80' : '#22c55e';
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });
}
function update() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  draw();
}
function turn(k) {
  if (k === 'start') return reset();
  const d = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }[k];
  if (!d || !started || over) return;
  if (d.x !== -dir.x || d.y !== -dir.y) next = d;
}
document.querySelectorAll('.pad button').forEach((b) => {
  b.addEventListener('touchstart', (e) => { e.preventDefault(); turn(b.dataset.k); }, { passive: false });
  b.addEventListener('click', () => turn(b.dataset.k));
});
document.addEventListener('keydown', (e) => {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', ' ': 'start', Enter: 'start' };
  if (map[e.key]) { e.preventDefault(); turn(map[e.key]); }
});
let tx, ty;
cv.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
cv.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}, { passive: true });
snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
dir = next = { x: 1, y: 0 };
food = { x: 3, y: 3 };
update();
</script>
</body>
</html>
